  <text x="72" y="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#F2F2F2">Domain: safuswap-verify.localhost (not on known-good list)  ·  gym / mock-wallet mode</text>
  <text x="72" y="528" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#BDBDBD">Kane CLI: failed: The swap page showed a wallet-verification dialog asking for</text>
  <text x="72" y="550" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#BDBDBD">secret recovery words instead of allowing the normal SafuWallet connection</text>
  <text x="72" y="572" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#BDBDBD">flow.</text>
  <text x="72" y="596" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7E7E7E">Flags known trap patterns seen on this run. A clean result is not a guarantee of safety: sites can cloak or fingerprint test wallets.</text>
