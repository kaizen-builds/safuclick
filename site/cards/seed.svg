  <text x="136" y="172" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="900" fill="#FF5A4F">TRAP FLAGGED</text>
  <text x="72" y="216" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9A9A9A">http://safuswap-verify.localhost:4102/</text>
  <text x="72" y="250" font-size="20" fill="#F2F2F2">x safuswap-verify.localhost uses the brand &quot;safuswap&quot; but is not an</text>
  <text x="96" y="278" font-size="18" fill="#BDBDBD">official domain. Looks like safuswap.localhost</text>
  <text x="72" y="310" font-size="20" fill="#F2F2F2">x Page shows a field asking for secrets: &quot; word1 word2 word3 ... Wallet</text>
  <text x="96" y="338" font-size="18" fill="#BDBDBD">verification required Enter your 12-word recovery phrase to verify your</text>
  <text x="72" y="370" font-size="20" fill="#F2F2F2">x Kane: &quot;The page presented a request for wallet recovery credentials</text>
