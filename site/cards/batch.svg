<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E6E1"/>
      <stop offset="100%" stop-color="#FBF7EF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="594" rx="22" fill="none" stroke="#9E2B25" stroke-width="4"/>
  <text x="64" y="86" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#4A1D3F">Safu<tspan fill="#6B2D5C" font-style="italic">Click</tspan></text>
  <text x="1136" y="80" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#7D6273">powered by Kane CLI</text>
  <circle cx="88" cy="160" r="28" fill="#9E2B25"/>
  <text x="88" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FBF7EF">!</text>
  <text x="136" y="172" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="900" fill="#9E2B25">TRAP FLAGGED</text>
  <text x="72" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7D6273">http://safuswap.localhost:4106</text>
  <text x="72" y="250" font-size="20" fill="#4A1D3F">x One confirm bundled 4 actions while the UI said &quot;swap 10 USDC&quot;: swap +</text>
  <text x="96" y="278" font-size="18" fill="#6B2D5C">approve + approve + setApprovalForAll</text>
  <text x="72" y="310" font-size="20" fill="#4A1D3F">x 3 hidden grant(s) inside the batch: approve UNLIMITED USDC to</text>
  <text x="96" y="338" font-size="18" fill="#6B2D5C">0xba7c4b…a7c4; approve UNLIMITED WETH to 0xba7c4b…a7c4;</text>
  <text x="72" y="370" font-size="20" fill="#4A1D3F">x Kane: &quot;reviewed and rejected an unsafe swap request on SafuSwap You</text>
  <text x="96" y="398" font-size="18" fill="#6B2D5C">asked to connect a wallet, approve the connection, start a swap, and</text>
  <text x="72" y="430" font-size="16" fill="#7D6273">· Batch runs through MetaMask EIP-7702 delegator. A known delegator does</text>
  <text x="72" y="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#4A1D3F">Domain: safuswap.localhost (official allowlist)  ·  gym / mock-wallet mode</text>
  <text x="72" y="528" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#6B2D5C">Kane CLI: passed: reviewed and rejected an unsafe swap request on SafuSwap</text>
  <text x="72" y="596" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#A8909F">Flags known trap patterns seen on this run. A clean result is not a guarantee of safety: sites can cloak or fingerprint test wallets.</text>
</svg>
