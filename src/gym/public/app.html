<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<script>window.__SAFU_COLLECTOR__ = {{COLLECTOR}}; window.__GYM__ = {{CONFIG}};</script>
<script src="/__safu/wallet.js"></script>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;font:15px/1.5 system-ui,-apple-system,sans-serif;color:#f5f3ff;background:radial-gradient(circle at 20% 0%,#5b21b6,#1e1b4b 55%,#0b0a1f)}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.5px} .logo span{color:#facc15}
  button{font:inherit;cursor:pointer} #connect{background:#facc15;color:#1e1b4b;border:0;border-radius:999px;padding:10px 18px;font-weight:700}
  main{display:flex;justify-content:center;padding:40px 16px}
  .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:22px;width:420px;backdrop-filter:blur(8px)}
  .card h1{margin:0 0 14px;font-size:20px} .field{background:rgba(0,0,0,.25);border-radius:16px;padding:14px;margin:8px 0}
  .field label{font-size:12px;opacity:.7;display:block} .row{display:flex;justify-content:space-between;align-items:center}
  .field input{background:transparent;border:0;color:#fff;font-size:28px;width:200px;outline:none}
  .tok{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-weight:700}
  #swap{width:100%;margin-top:12px;padding:14px;border-radius:16px;border:0;background:#7c3aed;color:#fff;font-weight:800;font-size:17px}
  #swap:disabled{opacity:.5;cursor:not-allowed} #status{margin-top:12px;min-height:22px;font-weight:600}
  footer{text-align:center;opacity:.5;font-size:12px;padding:20px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:500}
  .modal .box{background:#fff;color:#111;border-radius:16px;padding:22px;width:440px}
  .modal textarea{width:100%;height:90px;margin:10px 0;border-radius:10px;border:1px solid #ccc;padding:8px;font:inherit}
  .modal button{background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
</style>
</head>
<body>
<header><div class="logo">Safu<span>Swap</span></div><button id="connect" type="button">Connect Wallet</button></header>
<main>
  <div class="card">
    <h1>Swap</h1>
    <div class="field"><label for="amount">You pay</label><div class="row"><input id="amount" name="amount" inputmode="decimal" value="10" aria-label="Amount to swap in USDC"><span class="tok">USDC</span></div></div>
    <div class="field"><label>You receive (est.)</label><div class="row"><span id="out" style="font-size:28px">0.0031</span><span class="tok">ETH</span></div></div>
    <button id="swap" type="button" disabled>Connect wallet to swap</button>
    <div id="status" role="status"></div>
  </div>
</main>
<footer>SafuClick phishing gym · test site "{{ID}}" · mock wallet, mock contracts, no real funds</footer>
<script src="/app.js"></script>
</body>
</html>
