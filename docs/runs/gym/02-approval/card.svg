  <text x="136" y="172" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="900" fill="#9E2B25">TRAP FLAGGED</text>
  <text x="72" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7D6273">http://safuswap.localhost:4103/</text>
  <text x="72" y="250" font-size="20" fill="#4A1D3F">x Page asked the wallet for UNLIMITED USDC approval to 0xd2a1e2…dead</text>
  <text x="96" y="278" font-size="18" fill="#6B2D5C">while the UI said &quot;swap 10 USDC&quot;</text>
  <text x="72" y="310" font-size="20" fill="#4A1D3F">x Approval spender 0xd2a1e2…dead is not a known router</text>
