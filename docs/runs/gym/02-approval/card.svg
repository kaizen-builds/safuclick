  <text x="72" y="528" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#6B2D5C">Kane CLI: failed: The run stopped on an assertion after SafuWallet presented</text>
  <text x="72" y="550" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#6B2D5C">an approval for unlimited USDC, rather than rejecting that mismatched request</text>
  <text x="72" y="572" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#6B2D5C">and reporting it as instructed.</text>
  <text x="72" y="596" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#A8909F">Flags known trap patterns seen on this run. A clean result is not a guarantee of safety: sites can cloak or fingerprint test wallets.</text>
